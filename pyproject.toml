[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "molledger"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# E402: scripts intentionally sys.path.insert(repo_root) before importing `src`/`scripts`.
# E501: dense scientific code aligns trailing comments past 100 cols on purpose.
# E702/E731: compact `a; b` tensor ops and small `f = lambda ...` helpers are deliberate here.
ignore = ["E402", "E501", "E702", "E731"]
