# Recreate with:  conda env create -f environment.yml
#
name: molledger
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.2
  - scikit-learn=1.7.2
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - pillow=12.3.0
  - pytest
  - pip
  - pip:
      # PyTorch cu128 wheels
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torch-geometric==2.8.0.post1
      - rdkit==2023.9.6
      - ogb==1.3.6
      - pytdc==1.1.15
      - huggingface-hub==0.36.2
      - pymupdf
